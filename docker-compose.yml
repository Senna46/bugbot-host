# Docker Compose for bugbot-host
# Persists state DB and cloned repos in a named volume.
#
# Authentication:
#   GitHub App: BUGBOT_HOST_APP_ID and BUGBOT_HOST_PRIVATE_KEY_PATH (or BUGBOT_HOST_PRIVATE_KEY)
#   GitHub user PAT: BUGBOT_HOST_GITHUB_TOKEN (Senna46, required for Bugbot)
#   Claude: CLAUDE_CODE_OAUTH_TOKEN (required on macOS)
#
# The service/container/volume were renamed from pr-shadow to bugbot-host.
# Always bring this stack up with --remove-orphans (see README) so a
# leftover pr-shadow container from before the rename is stopped instead
# of continuing to run alongside this one on its own volume and lock file.

services:
  bugbot-host:
    build: .
    container_name: bugbot-host
    restart: unless-stopped
    env_file: .env
    environment:
      - BUGBOT_HOST_WORK_DIR=/data/repos
      - BUGBOT_HOST_DB_PATH=/data/db/state.db
    volumes:
      - bugbot-host-data:/data
      - ${HOME}/.claude:/root/.claude
      - ${HOME}/.claude.json:/root/.claude.json

volumes:
  bugbot-host-data:
